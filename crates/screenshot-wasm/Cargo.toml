[package]
name = "screenshot-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WASM bridge exposing FullScreenShot's Rust core to the extension"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screenshot-core = { path = "../screenshot-core" }
screenshot-png = { path = "../screenshot-png" }
screenshot-pdf = { path = "../screenshot-pdf" }
screenshot-md = { path = "../screenshot-md" }
wasm-bindgen = "0.2"
js-sys = "0.3"
