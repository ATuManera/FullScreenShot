[package]
name = "screenshot-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Paginated raster PDF export for FullScreenShot captures"

[dependencies]
screenshot-core = { path = "../screenshot-core" }
pdf-writer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[dev-dependencies]
# The integration tests read back the PDFs this crate writes; inflating a
# stream is all they need, and the crate already depends on flate2 to write
# them.
flate2 = "1"
