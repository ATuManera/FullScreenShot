<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>FullScreenShot</title>
  <rect x="0" y="0" width="128" height="128" rx="26" fill="#4F46E5"/>
  <!-- page peeking from behind the camera, flush with its right edge -->
  <rect x="70" y="60" width="26" height="56" rx="6" fill="#FFFFFF"/>
  <!-- camera: viewfinder bump + body, shifted left so the page tab reads beside it -->
  <rect x="40" y="27" width="28" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="12" y="42" width="84" height="58" rx="13" fill="#FFFFFF"/>
  <!-- lens -->
  <circle cx="54" cy="71" r="19" fill="#4F46E5"/>
</svg>
