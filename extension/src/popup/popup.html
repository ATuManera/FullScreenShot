<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FullScreenShot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>FullScreenShot</h1>
    <p role="status" id="status" aria-live="polite">Ready.</p>
    <nav aria-label="Capture actions">
      <button type="button" id="capture-visible">Capture Visible</button>
      <button type="button" id="capture-fullpage">Capture Full Page</button>
      <button type="button" disabled aria-disabled="true" title="Coming in P2">Select Scroll Area</button>
    </nav>
    <button type="button" id="cancel" hidden>Cancel</button>
    <a href="../options/options.html" target="_blank" rel="noopener">Settings / About</a>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
