<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FullScreenShot — Result</title>
  <link rel="stylesheet" href="result.css" />
</head>
<body>
  <main>
    <h1>FullScreenShot</h1>
    <p id="status" role="status">Loading…</p>
    <div id="preview-wrap" hidden>
      <img id="image-preview" alt="Captured page" hidden />
      <iframe id="pdf-preview" title="Captured PDF" hidden></iframe>
      <pre id="text-preview" hidden></pre>
    </div>
    <a id="download-link" hidden>Download</a>
  </main>
  <script type="module" src="result.js"></script>
</body>
</html>
